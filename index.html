function queueCards(items){return items.length?items.map(({id,s,field},i)=>songCard(s,`<small>#${i+1} · ${count(s)} votes · Requested by ${esc(s.name||'Guest')}</small>`+(field==='requests'?btn((s.votes?.[uid]?'✓ ':'')+'Vote · '+count(s),()=>vote(id,s)):'')+(admin?btn('Play now',()=>play(s),'primary')+btn('Dismiss',()=>put(field+'/'+id,null)):''))).join(''):'<p>No songs requested yet.</p>'}

st,name,at:Date.now()})){draft={title:'',artist:'',name};tab='Up Next';render()}}finally{busy=false}}}else if(tab==='Up Next'){m.innerHTML='<h2>Up next</h2><p>Ranked by votes, then request time. Musicians may choose any song.</p>'+queueCards(queue)}else if(tab==='History'){m.innerHTML='<h2>Played tonight</h2>'+entries(state.history).sort((a,b)=>b[1].at-a[1].at).map(([id,s])=>songCard(s)).join('')}else{m.innerHTML='<h2>Musician’s corner</h2>'+(!admin?'<p>Sign in to manage the party.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password">'+btn('Sign in',async()=>{try{if(!ready)throw new Error('Still connecting');await api.signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){alert(e.message)}}):btn('Sign out',async()=>{await api.signOut(auth)})+btn('End song',()=>put('now',null))+'<h2>Live requests & queue</h2>'+queueCards(queue)+'<section><h2>Play from songbook</h2><input id="adminSearch" placeholder="Find a song"><div id="adminSongs"></div></section><section><h2>Add to songbook</h2><input id="newTitle" placeholder="Song title"><input id="newArtist" placeholder="Artist">'+btn('Add song',()=>{let title=$('newTitle').value.trim();if(title)put('songs/'+crypto.randomUUID(),{title,artist:$('newArtist').value.trim()})})+'</section><section><h2>Reset party</h2><p>Clears requests, votes, queue, history and Now Playing. Keeps the songbook.</p>'+btn('Reset party',async()=>{if(!confirm('Clear all party activity for everyone? This cannot be undone.'))return;try{await api.update(api.ref(db,'party'),{requests:null,queue:null,history:null,now:null})}catch(e){alert(e.message)}})+'</section>');if(admin){let filter=()=>{$('adminSongs').innerHTML=songs.filter(s=>(s.title+' '+s.artist).toLowerCase().includes($('adminSearch').value.toLowerCase())).map(s=>songCard(s,btn('Play now',()=>play(s)))).join('')};$('adminSearch').oninput=filter;filter()}}}
render();try{let app=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),a=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),d=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js');api={...a,...d};let instance=app.initializeApp(config);auth=a.getAuth(instance);db=d.getDatabase(instance);let stop; a.onAuthStateChanged(auth,async user=>{if(stop){stop();stop=null}ready=false;admin=false;if(!user){connectionStatus='Connecting…';render();try{await a.signInAnonymously(auth)}catch(e){connectionStatus='Sign-in failed: '+e.message;render()}return}uid=user.uid;admin=!user.isAnonymous&&uid===ADMIN_UID;stop=d.onValue(d.ref(db,'party'),snap=>{state=snap.val()||{};ready=true;connectionStatus='Live shared songbook'+(admin?' • Musician signed in':'');render()},e=>{ready=false;connectionStatus='Database unavailable: '+e.message;render()})});}catch(e){connectionStatus='Connection failed: '+e.message;render()}
