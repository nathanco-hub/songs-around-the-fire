<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Songs Around the Fire</title><style>body{margin:auto;max-width:760px;padding:18px;background:#19221c;color:#f5e7cc;font:17px system-ui}header{text-align:center;padding:24px 0;background:radial-gradient(ellipse at bottom,#654329,transparent 75%)}h1{font: bold 38px Georgia;margin:8px}h2{font: bold 25px Georgia}small,p{color:#d0c6b1}button,input,select{font:inherit;border:1px solid #68705b;border-radius:9px;padding:11px;background:#303c30;color:#fff}button{cursor:pointer}button.active,.primary{background:#e4b875;color:#211c15}nav{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}section,article{background:#253027;border:1px solid #455343;border-radius:12px;padding:14px;margin:10px 0}a{color:#f2c780}.pdf-link{display:inline-block;background:#e4b875;color:#211c15;padding:10px;border-radius:8px;font-weight:bold;text-decoration:none}input{box-sizing:border-box;max-width:100%;width:100%;margin:5px 0}article strong{display:block}article small{display:block;margin:4px 0 10px}.actions{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.muted{font-size:13px;color:#c0b8a5}#status{text-align:center}button:disabled{opacity:.5}label{display:block;margin-top:8px}</style><header><div style="font-size:48px">🔥</div><h1>Songs Around the Fire</h1><p>Kendal’s Birthday • November 28, 2026</p><small>Grab an instrument. Raise a glass. Sing along.</small></header><p id="status" class="muted"></p><section id="now"></section><nav id="nav"></nav><main id="main"></main><footer><p class="muted">Band chord sheets open PDFs; other chord and lyric links open external search results. Choose the arrangement announced by the musicians.</p></footer><script type="module">

itle": "Tennessee Whiskey", "artist": "Chris Stapleton"}, {"id": "s20", "title": "Wagon Wheel", "artist": "Old Crow Medicine Show", "pdf": "charts/wagon-wheel.pdf"}];
const config = {apiKey:"AIzaSyABDvNTCF-RKqaexx55zwi0y5RMQeqbruc",authDomain:"songs-around-the-fire.firebaseapp.com",projectId:"songs-around-the-fire",storageBucket:"songs-around-the-fire.firebasestorage.app",messagingSenderId:"702264483032",appId:"1:702264483032:web:372ce364c7c3cb8ba7cbad",databaseURL:"https://songs-around-the-fire-default-rtdb.firebaseio.com"};
const ADMIN_UID='BlcZxvdXNle9qffaeM1QHK99CEB2';
let ready=false, connectionStatus='Connecting to live songbook…';
let db,auth,api,admin=false,uid=localStorage.campfireUid||(localStorage.campfireUid=crypto.randomUUID()),tab='Songbook',query='',state={songs:{},requests:{},queue:{},history:{},now:null};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{if(!config)state=JSON.parse(localStorage.campfireState)||state}catch{}
const entries=x=>Object.entries(x||{}), onlineLinks=s=>['Lyrics','Chords','Alternative chords'].map(kind=>`<a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(s.title+' '+(s.artist||'')+' '+(kind==='Alternative chords'?'free guitar chords -site:ultimate-guitar.com':kind==='Chords'?'free community guitar chords':kind.toLowerCase()))}">${kind} ↗</a>`).join(' · ');
const norm=s=>String(s||'').normalize('NFKD').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
const same=(a,b)=>norm(a.title)===norm(b.title)&&(!norm(a.artist)||!norm(b.artist)||norm(a.artist)===norm(b.artist));

const links=s=>{let chart=chartFor(s);return (chart?.pdf?`<a class="pdf-link" target="_blank" rel="noopener noreferrer" href="${chart.pdf}">Band Chord Sheet (PDF) ↗</a> · `:'')+onlineLinks(s)};

async function put(path,value){try{if(config && !ready)throw new Error('Still connecting. Please try again.');if(db){await api.set(api.ref(db,'party/'+path),value)}else{let p=path.split('/'),o=state;while(p.length>1){let k=p.shift();o=o[k]||(o[k]={})}if(value===null)delete o[p[0]];else o[p[0]]=value;localStorage.campfireState=JSON.stringify(state);render()}return true}catch(e){alert('Could not save: '+e.message);return false}}
const songCard=(s,extra='')=>`<article><strong>${esc(s.title)}</strong><small>${esc(s.artist)} ${s.key?' · Key '+esc(s.key):''} ${s.capo!==undefined?' · Capo '+esc(s.capo):''}</small><div class="actions">${links(s)} ${extra}</div></article>`;
let actions={};function btn(label,fn,cls=''){let id=crypto.randomUUID();actions[id]=fn;return `<button class="${cls}" data-act="${id}">${esc(label)}</button>`}document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b)actions[b.dataset.act]?.()});

async function play(s){if(busy||!admin||!ready)return;let key=prompt('Key (optional)',s.key||'');if(key===null)return;let capo=prompt('Capo fret (optional)',s.capo??'');if(capo===null)return;let n={title:s.title,artist:s.artist||'',key,capo,at:Date.now()};let changes={now:n,['history/'+crypto.randomUUID()]:n};for(let field of ['requests','queue'])for(let [id,item] of entries(state[field]))if(same(s,item))changes[field+'/'+id]=null;busy=true;try{await api.update(api.ref(db,'party'),changes)}catch(e){alert('Could not play: '+e.message)}finally{busy=false}}

function queueCards(items){return items.length?items.map(({id,s,field},i)=>songCard(s,`<small>#${i+1} · ${count(s)} votes · Requested by ${esc(s.name||'Guest')}</small>`+(field==='requests'?btn((s.votes?.[uid]?'✓ ':'')+'Vote · '+count(s),()=>vote(id,s)):'')+(admin?btn('Play now',()=>play(s),'primary')+btn('Dismiss',()=>put(field+'/'+id,null)):''))).join(''):'<p>No songs requested yet.</p>'}
function render(){actions={};$('status').textContent=connectionStatus;$('now').innerHTML='<small>NOW PLAYING</small>'+ (state.now?songCard(state.now,admin?btn('End song',()=>put('now',null)):''):'<h2>Waiting for the first song</h2>');$('nav').innerHTML=['Songbook','Request','Up Next','History','Musicians'].map(t=>btn(t,()=>{tab=t;render()},tab===t?'active':'')).join('');let m=$('main'),songs=seed,queue=ranked();if(tab==='Songbook'){m.innerHTML='<h2>Campfire Songbook</h2><input id="search" placeholder="Search songs or artists" value="'+esc(query)+'"><div id="songs"></div>';function filter(){ $('songs').innerHTML=songs.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(query.toLowerCase())).map(s=>songCard(s,btn('Request',()=>request(s))+(admin?btn('Play now',()=>play(s)):''))).join('')} $('search').oninput=e=>{query=e.target.value;filter()};filter()}else if(tab==='Request'){m.innerHTML=`<section><h2>Request a song</h2><p>Requests automatically join Up Next. Vote for an existing request instead of adding it again.</p><form id="form"><label>Song title<input id="title" required maxlength="150" value="${esc(draft.title)}"></label><label>Artist<input id="artist" maxlength="150" value="${esc(draft.artist)}"></label><label>Your name (optional)<input id="name" maxlength="80" value="${esc(draft.name)}"></label><button class="primary">Submit request</button></form></section><h2>Requests</h2>`+queueCards(queue);for(let k of ['title','artist','name'])$(k).oninput=e=>draft[k]=e.target.value;$('form').onsubmit=async e=>{e.preventDefault();if(busy||!ready)return;let title=draft.title.trim(),artist=draft.artist.trim(),name=draft.name.trim();if(!title)return;let existing=ranked().find(x=>same(x.s,{title,artist}));if(existing){if(existing.field==='requests'&&!existing.s.votes?.[uid]&&confirm('Already requested! Vote for it instead?'))await vote(existing.id,existing.s);tab='Up Next';render();return}busy=true;try{if(await put('requests/'+crypto.randomUUID(),{title,artist,name,at:Date.now()})){draft={title:'',artist:'',name};tab='Up Next';render()}}finally{busy=false}}}else if(tab==='Up Next'){m.innerHTML='<h2>Up next</h2><p>Ranked by votes, then request time. Musicians may choose any song.</p>'+queueCards(queue)}else if(tab==='History'){m.innerHTML='<h2>Played tonight</h2>'+entries(state.history).sort((a,b)=>b[1].at-a[1].at).map(([id,s])=>songCard(s)).join('')}else{m.innerHTML='<h2>Musician’s corner</h2>'+(!admin?'<p>Sign in to manage the party.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password">'+btn('Sign in',async()=>{try{if(!ready)throw new Error('Still connecting');await api.signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){alert(e.message)}}):btn('Sign out',async()=>{await api.signOut(auth)})+btn('End song',()=>put('now',null))+'<h2>Live requests & queue</h2>'+queueCards(queue)+'<section><h2>Play from songbook</h2><input id="adminSearch" placeholder="Find a song"><div id="adminSongs"></div></section><section><h2>Reset party</h2><p>Clears requests, votes, queue, history and Now Playing. Keeps the songbook.</p>'+btn('Reset party',async()=>{if(!confirm('Clear all party activity for everyone? This cannot be undone.'))return;try{await api.update(api.ref(db,'party'),{requests:null,queue:null,history:null,now:null})}catch(e){alert(e.message)}})+'</section>');if(admin){let filter=()=>{$('adminSongs').innerHTML=songs.filter(s=>(s.title+' '+s.artist).toLowerCase().includes($('adminSearch').value.toLowerCase())).map(s=>songCard(s,btn('Play now',()=>play(s)))).join('')};$('adminSearch').oninput=filter;filter()}}}
render();try{let app=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),a=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),d=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js');api={...a,...d};let instance=app.initializeApp(config);auth=a.getAuth(instance);db=d.getDatabase(instance);let stop; a.onAuthStateChanged(auth,async user=>{if(stop){stop();stop=null}ready=false;admin=false;if(!user){connectionStatus='Connecting…';render();try{await a.signInAnonymously(auth)}catch(e){connectionStatus='Sign-in failed: '+e.message;render()}return}uid=user.uid;admin=!user.isAnonymous&&uid===ADMIN_UID;stop=d.onValue(d.ref(db,'party'),snap=>{state=snap.val()||{};ready=true;connectionStatus='Live shared songbook'+(admin?' • Musician signed in':'');render()},e=>{ready=false;connectionStatus='Database unavailable: '+e.message;render()})});}catch(e){connectionStatus='Connection failed: '+e.message;render()}
