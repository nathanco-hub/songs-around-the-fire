let db,auth,api,admin=false,uid=localStorage.campfireUid||(localStorage.campfireUid=crypto.randomUUID()),tab='Songbook',query='',state={songs:{},requests:{},queue:{},history:{},now:null};

async function put(path,value){try{if(config && !ready)throw new Error('Still connecting. Please try again.');if(db){await api.set(api.ref(db,'party/'+path),value)}else{let p=path.split('/'),o=state;while(p.length>1){let k=p.shift();o=o[k]||(o[k]={})}if(value===null)delete o[p[0]];else o[p[0]]=value;localStorage.campfireState=JSON.stringify(state);render()}return true}catch(e){alert('Could not save: '+e.message);return false}}

function render(){actions={};$('status').textContent=connectionStatus;$('now').innerHTML='<small>NOW PLAYING</small>'+ (state.now?songCard(state.now):'<h2>Waiting for the first song</h2>');$('nav').innerHTML=['Songbook','Request','Up Next','History','Musicians'].map(t=>btn(t,()=>{tab=t;render()},tab===t?'active':'')).join('');let m=$('main');let songs=[...seed,...Object.values(state.songs||{})];let req=entries(state.requests).sort((a,b)=>Object.keys(b[1].votes||{}).length-Object.keys(a[1].votes||{}).length);let queue=entries(state.queue).sort((a,b)=>a[1].at-b[1].at);if(tab==='Songbook'){m.innerHTML='<input id="search" placeholder="Search songs or artists" value="'+esc(query)+'"><div id="songs"></div>';function filter(){ $('songs').innerHTML=songs.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(query.toLowerCase())).map(s=>songCard(s,btn('Request',()=>request(s))+(admin?btn('Play',()=>play(s)):''))).join('')} $('search').oninput=e=>{query=e.target.value;filter()};filter()}else if(tab==='Request'){m.innerHTML=`<section><h2>Request a song</h2><form id="form"><label>Song title<input id="title" required maxlength="150"></label><label>Artist<input id="artist" maxlength="150"></label><label>Your name (optional)<input id="name" maxlength="80"></label><button class="primary">Submit request</button></form></section><h2>Requests</h2>`+req.map(([id,s])=>songCard(s,`<small>Requested by ${esc(s.name||'Guest')}</small>`+btn((s.votes?.[uid]?'✓ ':'')+'Vote · '+Object.keys(s.votes||{}).length,()=>put('requests/'+id+'/votes/'+uid,s.votes?.[uid]?null:true))+(admin?btn('Queue',async()=>{if(await put('queue/'+id,{title:s.title,artist:s.artist,at:Date.now()}))await put('requests/'+id,null)})+btn('Dismiss',()=>put('requests/'+id,null)) :''))).join('');$('form').onsubmit=async e=>{e.preventDefault();let title=$('title').value.trim();if(!title)return;if(await put('requests/'+crypto.randomUUID(),{title,artist:$('artist').value.trim(),name:$('name').value.trim(),at:Date.now()}))render()}}else if(tab==='Up Next'){m.innerHTML='<h2>Up next</h2>'+ (queue.length?queue.map(([id,s])=>songCard(s,admin?btn('Play',async()=>{if(await play(s))await put('queue/'+id,null)})+btn('Remove',()=>put('queue/'+id,null)):'')).join(''):'<p>No songs queued yet.</p>')}else if(tab==='History'){m.innerHTML='<h2>Played tonight</h2>'+entries(state.history).sort((a,b)=>b[1].at-a[1].at).map(([id,s])=>songCard(s)).join('')}else{m.innerHTML='<h2>Musician’s corner</h2>'+(!admin?'<p>Sign in to manage the party.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password">'+btn('Sign in',async()=>{try{if(!ready)throw new Error('Still connecting');await api.signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){alert(e.message)}}):btn('Sign out',async()=>{if(db)await api.signOut(auth);else{admin=false;render()}})+btn('Clear now playing',()=>put('now',null))+'<section><h2>Add to songbook</h2><input id="newTitle" placeholder="Song title"><input id="newArtist" placeholder="Artist">'+btn('Add song',()=>{let title=$('newTitle').value.trim();if(title)put('songs/'+crypto.randomUUID(),{title,artist:$('newArtist').value.trim()})})+'</section><p>Use Songbook to play songs, Requests to approve them, and Up Next to manage the queue.</p>')}}
render();try{let app=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),a=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),d=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js');api={...a,...d};let instance=app.initializeApp(config);auth=a.getAuth(instance);db=d.getDatabase(instance);let stop; a.onAuthStateChanged(auth,async user=>{if(stop){stop();stop=null}ready=false;admin=false;if(!user){connectionStatus='Connecting…';render();try{await a.signInAnonymously(auth)}catch(e){connectionStatus='Sign-in failed: '+e.message;render()}return}uid=user.uid;admin=!user.isAnonymous&&uid===ADMIN_UID;stop=d.onValue(d.ref(db,'party'),snap=>{state=snap.val()||{};ready=true;connectionStatus='Live shared songbook'+(admin?' • Musician signed in':'');render()},e=>{ready=false;connectionStatus='Database unavailable: '+e.message;render()})});}catch(e){connectionStatus='Connection failed: '+e.message;render()}
